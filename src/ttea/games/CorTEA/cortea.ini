; Configurações do CorTEA. Todos os campos são opcionais: o que faltar usa o
; padrão definido em gameutil/gamesettings.py.

[jogo]
; Fase em que a sessão começa (a plataforma também pode enviar --phase)
fase_inicial = 1
; Quantos caminhos diferentes o jogador percorre em cada fase
rodadas_por_fase = 2
; Fração do índice de desempenho máximo exigida para avançar de fase
; (abaixo disso o jogador repete a fase). Ex.: 0.6 = 60%
id_minimo_fracao = 0.6
; Tempo máximo de cada rodada, em segundos (0 = sem limite)
tempo_limite_rodada_s = 120

[ajuda]
ajudas_iniciais = 3
ajudas_maximo = 3
; Segundos sem responder até a ajuda visual aparecer
tempo_inatividade_s = 6

[rastreamento]
; Tempo que a mão precisa ficar sobre o quadrado para selecioná-lo
tempo_permanencia_ms = 700
; "palma" (centro da mão) ou "indicador" (ponta do dedo indicador)
ponto_da_mao = palma
; Abre a imagem da webcam numa janela separada do jogo, como no KarTEA
; (tecla C liga/desliga; fechar a janela pelo X também desliga)
mostrar_previa = true
; Espelha a imagem da webcam (tecla E liga/desliga). Se a sua webcam já
; entrega a imagem espelhada, use false.
espelhar_camera = true

[som]
ligado = true
volume = 0.5
